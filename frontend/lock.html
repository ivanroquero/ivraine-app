<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ededf0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Ivraine — Our Little Scrapbook</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/couple-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/couple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ivraine">
  <meta name="application-name" content="Ivraine">
  <link rel="stylesheet" href="/legacy/lock.css">
  <link rel="stylesheet" href="/src/proposal.css">
  <link rel="stylesheet" href="/src/vpn-shield.css">
</head>
<body>
  <main class="lock-screen" id="lock-screen">
    <div class="lock-brand">
      <img src="/icons/couple-192.png" alt="Ivan and Loraine" width="44" height="44"> our little scrapbook.
    </div>
    <section class="lock-card" aria-labelledby="lock-title">
      <span class="eyebrow">JUST BETWEEN US</span>
      <img class="lock-couple" src="/icons/couple-192.png" alt="Our couple photo" width="86" height="86">
      <h1 id="lock-title">A little space<br>for <em>us.</em></h1>
      <p class="lock-intro">A few memories, a whole lot of love.<br>Enter our passcode to step inside.</p>
      <form id="unlock-form">
        <label for="passcode">Our passcode</label>
        <div class="input-wrap">
          <input id="passcode" name="passcode" type="password" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-describedby="unlock-status" placeholder="8 digits">
          <button id="show-passcode" type="button" aria-label="Show passcode" aria-pressed="false">Show</button>
        </div>
        <button class="unlock-button" id="unlock-button" type="submit">Open our scrapbook <span>&rarr;</span></button>
        <p id="unlock-status" class="status" role="status" aria-live="polite"></p>
      </form>
      <div class="lock-note">a little secret, a little love.</div>
    </section>
    <div class="pwa-install">
      <button id="install-app" type="button" hidden>Install Ivraine</button>
      <button id="install-help" type="button">Add to Home Screen</button>
      <p id="offline-status" role="status" aria-live="polite"></p>
    </div>
    <p class="lock-footer">SOME THINGS ARE WORTH KEEPING.</p>
    <div style="margin-top:14px;font-size:11px;opacity:0.4;text-align:center;">
      <a href="/index.html?space=true" style="color:inherit;text-decoration:none;">Private space v2 ↗</a> &bull;
      <a href="/admin" style="color:inherit;text-decoration:none;margin-left:6px;">Admin ⚙</a>
    </div>
    <noscript>Turn on JavaScript to unlock this scrapbook.</noscript>
  </main>
  <div id="scrapbook-host" hidden></div>
  <aside id="update-bar" hidden>
    <span>A new version is ready.</span>
    <button id="apply-update" type="button">Update &amp; lock</button>
    <button id="dismiss-update" type="button" aria-label="Dismiss update notification">&times;</button>
  </aside>
  <dialog id="install-dialog" aria-labelledby="install-title">
    <h2 id="install-title">Keep us close.</h2>
    <p id="install-instructions"></p>
    <button id="close-install" type="button">Got it</button>
  </dialog>

  <script type="module" src="/src/lock.ts"></script>
  <script type="module" src="/src/proposal.ts"></script>
  <script type="module" src="/src/pwa.ts"></script>
</body>
</html>
