name: ivraine_flutter
description: "Ivraine — Our Little Space. A private romantic mobile scrapbook and sanctuary for Ivan & Loraine."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Network & Backend
  http: ^1.2.1
  url_launcher: ^6.2.6

  # State Management & Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Formatting & Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  path: ^1.9.0

  # Media & Hardware
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  audioplayers: ^6.0.0
  geolocator: ^11.0.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # UI & Animations
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
